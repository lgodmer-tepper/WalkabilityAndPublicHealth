name: Monitor Goldendale Observatory Availability

on:
  schedule:
    - cron: "46 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Download page
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            -o page.html \
            "https://washington-state-parks.trumba.com/goldendale-observatory-state-park/Night-Program/E199051246"

      - name: Check availability
        id: check
        shell: bash
        run: |
          if grep -qi "Event is full" page.html; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send SMS
        if: steps.check.outputs.available == 'true'
        env:
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM: ${{ secrets.TWILIO_FROM }}
          TO: ${{ secrets.TWILIO_TO }}
        run: |
          curl -X POST "https://api.twilio.com/2010-04-01/Accounts/$SID/Messages.json" \
            --data-urlencode "To=$TO" \
            --data-urlencode "From=$FROM" \
            --data-urlencode "Body=🚨 Goldendale Observatory may have an opening! Check immediately: https://washington-state-parks.trumba.com/goldendale-observatory-state-park/Night-Program/E199051246" \
            -u "$SID:$TOKEN"
